name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t mediatrack:ci .

  backend:
    runs-on: ubuntu-latest
    # Одна тестова БД на всі запуски: міграції і тести не мають іти паралельно.
    concurrency:
      group: backend-test-database
      cancel-in-progress: false
    env:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: backend/pyproject.toml
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Python
        run: uv python install
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check test database secret
        run: |
          if [ -z "$TEST_DATABASE_URL" ]; then
            echo "::error::Secret TEST_DATABASE_URL is not set (Neon test branch)"
            exit 1
          fi
      - name: Apply migrations to test database
        run: uv run --locked alembic -x database=test upgrade head
      - name: Run backend tests
        run: uv run --locked pytest -q -rs --database-tests
