[project]
name = "mediatrack-backend"
version = "0.1.0"
description = "MediaTrack FastAPI backend"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115",
    "psycopg[binary]>=3.3,<4",
    "pydantic-settings>=2,<3",
    "sqlalchemy>=2.1,<3",
    "uvicorn[standard]>=0.32",
]

[tool.uv]
required-version = "==0.13.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]
