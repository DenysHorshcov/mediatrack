[project]
name = "mediatrack-backend"
version = "0.1.0"
description = "MediaTrack FastAPI backend"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20,<2",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "httpx>=0.27",
    "psycopg[binary]>=3.3,<4",
    "pydantic-settings>=2,<3",
    "pyjwt>=2.9,<3",
    "sqlalchemy>=2.1,<3",
    "uvicorn[standard]>=0.32",
]

[tool.uv]
required-version = "==0.13.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["database: PostgreSQL integration tests enabled with --database-tests"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pillow>=13.0.0",
    "pytest>=8.3",
    "respx>=0.22",
]
